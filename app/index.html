<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spaceship-management-sim</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111827;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #info {
        position: absolute;
        min-width: 140px;
        padding: 8px 12px;
        background: #1f2937;
        border: 1px solid #64748b;
        color: #e5e7eb;
        font: 14px monospace;
        pointer-events: none;
      }
      #info[hidden] {
        display: none;
      }
      #info h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      #info-line {
        white-space: pre-line;
      }
      #build-controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font: 13px monospace;
      }
      #build-controls[hidden] { display: none; }
      .build-toggle {
        position: absolute;
        width: 50px;
        height: 50px;
        padding: 11px;
        border: 0;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
      }
      .build-toggle span {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid #94a3b8;
        background: #1f2937;
        color: #f8fafc;
        font: bold 20px monospace;
      }
      #build-menu {
        position: absolute;
        z-index: 2;
        display: grid;
        gap: 4px;
        width: 210px;
        padding: 8px;
        border: 1px solid #64748b;
        background: #1f2937;
      }
      #build-menu[hidden] { display: none; }
      #build-menu button {
        display: flex;
        justify-content: space-between;
        padding: 7px;
        border: 1px solid #64748b;
        background: #334155;
        color: #f8fafc;
        font: 12px monospace;
        cursor: pointer;
      }
      #build-menu button:disabled {
        color: #64748b;
        background: #1e293b;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="build-controls" hidden></div>
    <div id="build-menu" hidden></div>
    <div id="info" hidden>
      <h2 id="info-title"></h2>
      <div id="info-line"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
