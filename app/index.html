<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spaceship-management-sim</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111827;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #sector-name { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #f8fafc; font: 16px monospace; pointer-events: none; }
      #info {
        position: absolute;
        min-width: 140px;
        padding: 8px 12px;
        background: #1f2937;
        border: 1px solid #64748b;
        color: #e5e7eb;
        font: 14px monospace;
        pointer-events: none;
      }
      #info[hidden] {
        display: none;
      }
      #info h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      #info-line {
        white-space: pre-line;
      }
      #build-controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font: 13px monospace;
      }
      #build-controls[hidden] { display: none; }
      .build-toggle {
        position: absolute;
        display: grid;
        place-items: center;
        width: var(--cell);
        height: var(--cell);
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
      }
      .build-toggle span {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        width: var(--glyph);
        height: var(--glyph);
        border: 1px solid #94a3b8;
        background: #1f2937;
        color: #f8fafc;
        font: bold calc(var(--glyph) * 0.77) monospace;
      }
      #build-menu {
        position: absolute;
        z-index: 2;
        display: grid;
        gap: 4px;
        width: 210px;
        padding: 8px;
        border: 1px solid #64748b;
        background: #1f2937;
      }
      #build-menu[hidden] { display: none; }
      #build-menu button {
        display: flex;
        justify-content: space-between;
        padding: 7px;
        border: 1px solid #64748b;
        background: #334155;
        color: #f8fafc;
        font: 12px monospace;
        cursor: pointer;
      }
      #build-menu button:disabled {
        color: #64748b;
        background: #1e293b;
        cursor: not-allowed;
      }
      #ship-menu, #ship-panel {
        position: absolute;
        z-index: 2;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #64748b;
        background: #1f2937;
        color: #e5e7eb;
        font: 12px monospace;
        --slot: 28px;
      }
      #ship-menu { width: 300px; display: grid; gap: 8px; }
      #ship-panel { top: 12px; right: 12px; width: 200px; --slot: 18px; }
      #ship-menu[hidden], #ship-panel[hidden] { display: none; }
      #ship-menu h2, #ship-panel h2 { margin: 0; font-size: 14px; }
      #ship-menu .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
      #ship-menu button {
        padding: 4px 7px;
        border: 1px solid #64748b;
        background: #334155;
        color: #f8fafc;
        font: 12px monospace;
        cursor: pointer;
      }
      #ship-menu button.pressed { outline: 2px solid #facc15; }
      #ship-menu button:disabled { color: #64748b; background: #1e293b; cursor: not-allowed; }
      .ship-grid { display: grid; gap: 2px; margin: 4px 0; }
      .ship-grid .slot {
        width: var(--slot);
        height: var(--slot);
        padding: 0;
        border: 1px solid #0f172a;
      }
      #ship-menu .stats { white-space: pre-line; }
      #ship-panel dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 0; }
      #ship-panel dt { color: #94a3b8; }
      #ship-panel dd { margin: 0; }
      #gate-menu { position: absolute; z-index: 3; padding: 6px; border: 1px solid #64748b; background: #1f2937; }
      #gate-menu[hidden] { display: none; }
      #claim-button { position: absolute; z-index: 3; top: 12px; left: 12px; padding: 8px 12px; border: 1px solid #64748b; background: #334155; color: #f8fafc; font: 13px monospace; cursor: pointer; }
      #hint { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); padding: 6px 10px; background: #1f2937; border: 1px solid #64748b; color: #f8fafc; font: 13px monospace; pointer-events: none; }
      #rename-box { position: absolute; z-index: 4; width: 120px; padding: 3px 6px; border: 1px solid #67e8f9; background: #0f172a; color: #f8fafc; font: 14px monospace; text-align: center; }
      #claim-button[hidden], #hint[hidden], #rename-box[hidden], #info-action[hidden] { display: none; }
      #info-action { margin-top: 8px; padding: 6px 10px; border: 1px solid #64748b; background: #334155; color: #f8fafc; font: 12px monospace; cursor: pointer; }
      #gate-menu button { padding: 7px 10px; border: 1px solid #64748b; background: #334155; color: #f8fafc; font: 12px monospace; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="sector-name" aria-live="polite"></div>
    <div id="build-controls" hidden></div>
    <div id="build-menu" hidden></div>
    <div id="ship-menu" hidden></div>
    <div id="gate-menu" hidden><button>Build gate here</button></div>
    <aside id="ship-panel" hidden></aside>
    <button id="claim-button" hidden>Build claim station</button>
    <div id="hint" hidden></div>
    <input id="rename-box" hidden maxlength="24" aria-label="Sector name" />
    <div id="info" hidden>
      <h2 id="info-title"></h2>
      <div id="info-line"></div>
      <button id="info-action" hidden></button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
