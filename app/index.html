<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spaceship-management-sim</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111827;
      }
      #screen {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #info {
        position: absolute;
        min-width: 140px;
        padding: 8px 12px;
        background: #1f2937;
        border: 1px solid #64748b;
        color: #e5e7eb;
        font: 14px monospace;
        pointer-events: none;
      }
      #info[hidden] {
        display: none;
      }
      #info h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="800" height="600"></canvas>
    <div id="info" hidden>
      <h2 id="info-title"></h2>
      <div id="info-line"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
